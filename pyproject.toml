[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unit-converter"
version = "0.1.0"
description = "Length unit converter with SRP/OCP design"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["unit_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["unit_converter"]
omit = ["unit_converter/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
